<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Presentation Portal</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            padding: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #eef2f7;

            color: #111827;
        }


        /* =========================
           HEADER
        ========================= */

        .header {

            background: #111827;

            color: white;

            padding: 16px;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }

        .header-title {

            font-size: 19px;

            font-weight: bold;
        }

        .logout-top {

            border: none;

            background: #dc2626;

            color: white;

            padding: 9px 14px;

            border-radius: 7px;

            font-weight: bold;

            cursor: pointer;
        }


        /* =========================
           CONTAINER
        ========================= */

        .container {

            width: 100%;

            max-width: 600px;

            margin: auto;

            padding: 18px;
        }


        /* =========================
           UPLOAD CARD
        ========================= */

        #uploadSection {

            background: white;

            border-radius: 15px;

            padding: 22px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.08);
        }

        .welcome {

            font-size: 24px;

            font-weight: bold;

            margin-bottom: 8px;
        }

        .description {

            color: #6b7280;

            margin-bottom: 22px;

            line-height: 1.5;
        }


        /* =========================
           INPUT
        ========================= */

        label {

            display: block;

            font-weight: bold;

            margin-bottom: 7px;
        }

        input[type="text"] {

            width: 100%;

            padding: 13px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-size: 16px;

            outline: none;
        }

        input[type="text"]:focus {

            border-color: #2563eb;
        }


        /* =========================
           FILE INPUT
        ========================= */

        .file-box {

            margin-top: 20px;
        }

        input[type="file"] {

            width: 100%;

            padding: 12px;

            border: 1px dashed #9ca3af;

            border-radius: 8px;

            background: #f9fafb;

            font-size: 14px;
        }

        .file-help {

            margin-top: 7px;

            color: #6b7280;

            font-size: 13px;
        }


        /* =========================
           UPLOAD BUTTON
        ========================= */

        .upload-btn {

            width: 100%;

            margin-top: 22px;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #2563eb;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        .upload-btn:hover {

            background: #1d4ed8;
        }

        .upload-btn:disabled {

            background: #9ca3af;

            cursor: not-allowed;
        }


        /* =========================
           MESSAGE
        ========================= */

        #message {

            margin-top: 15px;

            padding: 11px;

            border-radius: 8px;

            display: none;

            font-size: 14px;
        }

        .error {

            background: #fee2e2;

            color: #991b1b;
        }

        .success {

            background: #dcfce7;

            color: #166534;
        }


        /* =========================
           PRESENTATION SECTION
        ========================= */

        #presentationSection {

            display: none;
        }

        .presentation-card {

            background: white;

            border-radius: 15px;

            overflow: hidden;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.08);
        }


        /* =========================
           STUDENT INFO
        ========================= */

        .student-info {

            padding: 16px;

            border-bottom:
                1px solid #e5e7eb;
        }

        .student-name {

            font-size: 20px;

            font-weight: bold;
        }

        .file-name {

            color: #6b7280;

            margin-top: 5px;

            font-size: 14px;

            word-break: break-word;
        }


        /* =========================
           SLIDE
        ========================= */

        .slide-container {

            background: #000;

            width: 100%;

            min-height: 260px;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 8px;
        }

        #slideImage {

            width: 100%;

            max-height: 55vh;

            object-fit: contain;

            display: block;
        }


        /* =========================
           PAGE NUMBER
        ========================= */

        .page-info {

            text-align: center;

            font-size: 17px;

            font-weight: bold;

            padding: 13px;
        }


        /* =========================
           ALL PAGES
        ========================= */

        .all-pages {
            padding: 0 15px 15px;
        }

        .all-pages-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .pages-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            max-height: 260px;
            overflow-y: auto;
            padding: 5px;
            background: #f3f4f6;
            border-radius: 10px;
        }

        .page-thumbnail {
            background: white;
            border: 2px solid #d1d5db;
            border-radius: 7px;
            padding: 3px;
            cursor: pointer;
            transition: 0.15s;
            position: relative;
        }

        .page-thumbnail img {
            width: 100%;
            aspect-ratio: 16 / 10;
            object-fit: contain;
            display: block;
            background: #111827;
            border-radius: 4px;
        }

        .page-thumbnail-number {
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            padding: 4px 0 2px;
            color: #374151;
        }

        .page-thumbnail.active {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37,99,235,0.20);
        }

        .page-thumbnail.active .page-thumbnail-number {
            color: #2563eb;
        }
        /* =========================
           NAVIGATION
        ========================= */

        .navigation {

            display: flex;

            gap: 10px;

            padding: 0 15px 15px;
        }

        .nav-btn {

            flex: 1;

            padding: 14px;

            border: none;

            border-radius: 9px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .previous {

            background: #e5e7eb;

            color: #111827;
        }

        .next {

            background: #2563eb;

            color: white;
        }

        .nav-btn:disabled {

            opacity: 0.45;

            cursor: not-allowed;
        }


        /* =========================
           BOTTOM BUTTONS
        ========================= */

        .bottom-buttons {

            display: flex;

            gap: 10px;

            padding: 0 15px 18px;
        }

        .end-btn,
        .logout-btn {

            flex: 1;

            padding: 12px;

            border: none;

            border-radius: 8px;

            font-weight: bold;

            cursor: pointer;
        }

        .end-btn {

            background: #f59e0b;

            color: white;
        }

        .logout-btn {

            background: #dc2626;

            color: white;
        }


        /* =========================
           LOADING
        ========================= */

        #loading {

            display: none;

            text-align: center;

            margin-top: 15px;

            color: #374151;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 450px) {

            .container {

                padding: 12px;
            }

            .welcome {

                font-size: 21px;
            }

            .header-title {

                font-size: 16px;
            }

            .logout-top {

                font-size: 12px;

                padding: 8px 10px;
            }

            .slide-container {

                min-height: 220px;
            }
        }

    </style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

    <div class="header-title">
        Presentation Portal
    </div>

    <button
        class="logout-top"
        onclick="logoutPresentation()"
    >
        Logout
    </button>

</div>


<div class="container">


    <!-- =================================================
         UPLOAD SECTION
    ================================================== -->

    <div id="uploadSection">

        <div class="welcome">
            Start Your Presentation
        </div>

        <div class="description">

            Enter your name and upload your
            presentation file.

            After uploading, control the presentation
            from this mobile.

        </div>


        <!-- STUDENT NAME -->

        <label for="studentNameInput">
            Student Name
        </label>

        <input
            type="text"
            id="studentNameInput"
            placeholder="Enter your full name"
            autocomplete="name"
        >


        <!-- FILE -->

        <div class="file-box">

            <label for="presentationFile">
                Presentation File
            </label>

            <input
                type="file"
                id="presentationFile"
                accept=".pdf,.ppt,.pptx,application/pdf,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation"
            >

            <div class="file-help">
                PDF, PPT or PPTX. Maximum 50 MB.
            </div>

        </div>


        <!-- UPLOAD -->

        <button
            class="upload-btn"
            id="uploadButton"
            onclick="uploadPresentation()"
        >
            Upload & Start Presentation
        </button>


        <div id="loading">
            Uploading presentation...
        </div>


        <div id="message"></div>

    </div>


    <!-- =================================================
         PRESENTATION SECTION
    ================================================== -->

    <div id="presentationSection">

        <div class="presentation-card">


            <!-- STUDENT INFO -->

            <div class="student-info">

                <div
                    class="student-name"
                    id="displayStudentName"
                >
                    Student
                </div>

                <div
                    class="file-name"
                    id="displayFileName"
                >
                    Presentation.pdf
                </div>

            </div>


            <!-- SLIDE -->

            <div class="slide-container">

                <img
                    id="slideImage"
                    src=""
                    alt="Presentation Slide"
                >

            </div>


            <!-- PAGE -->

            <div
                class="page-info"
                id="pageInfo"
            >
                Page 1 / 1
            </div>



            <!-- ALL PAGES -->

            <div class="all-pages">

                <div class="all-pages-title">
                    All Pages
                </div>

                <div
                    class="pages-grid"
                    id="pagesGrid"
                >
                </div>

            </div>

            <!-- NAVIGATION -->

            <div class="navigation">

                <button
                    class="nav-btn previous"
                    id="previousButton"
                    onclick="changePage(-1)"
                >
                    â—€ Previous
                </button>

                <button
                    class="nav-btn next"
                    id="nextButton"
                    onclick="changePage(1)"
                >
                    Next â–¶
                </button>

            </div>


            <!-- BOTTOM -->

            <div class="bottom-buttons">

                <button
                    class="end-btn"
                    onclick="endPresentation()"
                >
                    End Presentation
                </button>

                <button
                    class="logout-btn"
                    onclick="logoutPresentation()"
                >
                    Logout
                </button>

            </div>

        </div>

    </div>

</div>


<script>

    const token =
        "{{ session.token }}";

    let currentPage = 1;

    let totalPages = 0;

    let presentationStarted = false;


    /* =====================================================
       MESSAGE
    ===================================================== */

    function showMessage(message, type = "error") {

        const box =
            document.getElementById("message");

        box.textContent = message;

        box.className = "";

        box.classList.add(type);

        box.style.display = "block";
    }


    /* =====================================================
       UPLOAD PRESENTATION
    ===================================================== */

    async function uploadPresentation() {

        const nameInput =
            document.getElementById("studentNameInput");

        const fileInput =
            document.getElementById("presentationFile");

        const uploadButton =
            document.getElementById("uploadButton");

        const loading =
            document.getElementById("loading");

        const studentName =
            nameInput.value.trim();

        const file =
            fileInput.files[0];


        /* VALIDATE NAME */

        if (!studentName) {

            showMessage(
                "Please enter your name."
            );

            nameInput.focus();

            return;
        }


        /* VALIDATE FILE */

        if (!file) {

            showMessage(
                "Please select your presentation file."
            );

            return;
        }


        if (
            ![".pdf", ".ppt", ".pptx"]
                .some(ext =>
                    file.name.toLowerCase().endsWith(ext)
                )
        ) {

            showMessage(
                "Only PDF, PPT and PPTX files are supported."
            );

            return;
        }


        /* MAX FILE SIZE */

        const maxFileSize =
            50 * 1024 * 1024;

        if (file.size > maxFileSize) {

            showMessage(
                "File is too large. Maximum size is 50 MB."
            );

            return;
        }


        uploadButton.disabled = true;

        loading.style.display = "block";

        loading.textContent =
            "Uploading presentation... 0%";


        try {

            /* =========================
               CHUNK SETTINGS
            ========================= */

            const chunkSize =
                4 * 1024 * 1024;

            const totalChunks =
                Math.ceil(
                    file.size / chunkSize
                );


            /* =========================
               SEND CHUNKS
            ========================= */

            for (
                let chunkIndex = 0;
                chunkIndex < totalChunks;
                chunkIndex++
            ) {

                const start =
                    chunkIndex * chunkSize;

                const end =
                    Math.min(
                        start + chunkSize,
                        file.size
                    );

                const chunk =
                    file.slice(start, end);


                const data =
                    await new Promise(
                        (resolve, reject) => {

                            const xhr =
                                new XMLHttpRequest();

                            xhr.open(
                                "POST",
                                `/student/${token}/upload-chunk`
                            );


                            xhr.setRequestHeader(
                                "X-Student-Name",
                                studentName
                            );

                            xhr.setRequestHeader(
                                "X-Filename",
                                file.name
                            );

                            xhr.setRequestHeader(
                                "X-File-Size",
                                file.size
                            );

                            xhr.setRequestHeader(
                                "X-Chunk-Index",
                                chunkIndex
                            );

                            xhr.setRequestHeader(
                                "X-Total-Chunks",
                                totalChunks
                            );


                            xhr.onload =
                                function() {

                                    try {

                                        const response =
                                            JSON.parse(
                                                xhr.responseText
                                            );

                                        if (
                                            xhr.status >= 200 &&
                                            xhr.status < 300
                                        ) {

                                            resolve(response);

                                        }
                                        else {

                                            reject(
                                                new Error(
                                                    response.message ||
                                                    "Upload failed."
                                                )
                                            );

                                        }

                                    }
                                    catch (error) {

                                        reject(error);

                                    }

                                };


                            xhr.onerror =
                                function() {

                                    reject(
                                        new Error(
                                            "Upload failed."
                                        )
                                    );

                                };


                            xhr.send(chunk);

                        }
                    );


                /* =========================
                   UPDATE MOBILE PROGRESS
                ========================= */

                const stateResponse =
                    await fetch("/api/state");

                const stateData =
                    await stateResponse.json();

                const progress =
                    Math.max(
                        0,
                        Math.min(
                            100,
                            Number(stateData.upload_progress) || 0
                        )
                    );

                loading.textContent =
                    `Uploading presentation... ${progress}%`;


                if (!data.success) {

                    throw new Error(
                        data.message ||
                        "Upload failed."
                    );

                }


                /* =========================
                   UPLOAD COMPLETE
                ========================= */

                if (data.complete) {

                    loading.textContent =
                        "Uploading presentation... 100%";

                    break;
                }

            }


            /* PRESENTATION STARTED */

            presentationStarted = true;

            document.getElementById(
                "uploadSection"
            ).style.display = "none";

            document.getElementById(
                "presentationSection"
            ).style.display = "block";


            loadState();

        }
        catch (error) {

            console.error(error);

            showMessage(
                error.message ||
                "Could not upload presentation."
            );

            uploadButton.disabled = false;

        }
        finally {

            loading.style.display = "none";

        }

    }

    /* =====================================================
       LOAD CURRENT STATE
    ===================================================== */

    async function loadState() {

        try {

            const response =
                await fetch(
                    "/api/state",
                    {
                        cache: "no-store"
                    }
                );

            const data =
                await response.json();


            if (!data.connected) {

                return;
            }


            currentPage =
                data.current_page;

            totalPages =
                data.total_pages;


            document.getElementById(
                "displayStudentName"
            ).textContent =
                data.student_name;


            document.getElementById(
                "displayFileName"
            ).textContent =
                data.filename;


            updateSlide();

            updateButtons();

            buildPageThumbnails();

        }

        catch (error) {

            console.log(
                "State error:",
                error
            );

        }

    }


    /* =====================================================
       UPDATE SLIDE
    ===================================================== */

    /* =====================================================
       ALL PAGES THUMBNAILS
    ===================================================== */

    function buildPageThumbnails() {

        const grid =
            document.getElementById("pagesGrid");

        if (!grid || totalPages < 1) {
            return;
        }

        grid.innerHTML = "";

        for (let page = 1; page <= totalPages; page++) {

            const button =
                document.createElement("div");

            button.className =
                "page-thumbnail";

            button.dataset.page =
                page;

            button.innerHTML = `
                <img
                    src="/slide/${token}/${page}?thumb=1"
                    alt="Page ${page}"
                    loading="lazy"
                >

                <div class="page-thumbnail-number">
                    ${page}
                </div>
            `;

            button.onclick = function() {
                selectPage(page);
            };

            grid.appendChild(button);
        }

        updateThumbnailHighlight();
    }


    /* =====================================================
       SELECT PAGE FROM THUMBNAIL
    ===================================================== */

    async function selectPage(page) {

        if (!presentationStarted) {
            return;
        }

        if (page < 1 || page > totalPages) {
            return;
        }

        if (page === currentPage) {
            updateThumbnailHighlight();
            return;
        }

        try {

            const response =
                await fetch(
                    "/api/page",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            page: page
                        })
                    }
                );

            const data =
                await response.json();

            if (data.success) {

                currentPage =
                    data.page;

                updateSlide();

                updateButtons();

                updateThumbnailHighlight();
            }

        }
        catch (error) {

            console.log(
                "Thumbnail page error:",
                error
            );
        }
    }


    /* =====================================================
       THUMBNAIL HIGHLIGHT
    ===================================================== */

    function updateThumbnailHighlight() {

        const thumbnails =
            document.querySelectorAll(
                ".page-thumbnail"
            );

        thumbnails.forEach(
            function(thumbnail) {

                const page =
                    Number(
                        thumbnail.dataset.page
                    );

                thumbnail.classList.toggle(
                    "active",
                    page === currentPage
                );
            }
        );

        const active =
            document.querySelector(
                ".page-thumbnail.active"
            );

        if (active) {

            active.scrollIntoView({
                behavior: "smooth",
                block: "nearest"
            });
        }
    }

    function updateSlide() {

        const image =
            document.getElementById(
                "slideImage"
            );

        image.src =
            `/slide/${token}/${currentPage}?t=${Date.now()}`;


        document.getElementById(
            "pageInfo"
        ).textContent =
            `Page ${currentPage} / ${totalPages}`;

        updateThumbnailHighlight();

    }


    /* =====================================================
       UPDATE BUTTONS
    ===================================================== */

    function updateButtons() {

        document.getElementById(
            "previousButton"
        ).disabled =
            currentPage <= 1;


        document.getElementById(
            "nextButton"
        ).disabled =
            currentPage >= totalPages;

    }


    /* =====================================================
       CHANGE PAGE
    ===================================================== */

    async function changePage(direction) {

        if (!presentationStarted) {
            return;
        }


        let newPage =
            currentPage + direction;


        if (newPage < 1) {
            newPage = 1;
        }


        if (newPage > totalPages) {
            newPage = totalPages;
        }


        if (newPage === currentPage) {
            return;
        }


        try {

            const response =
                await fetch(
                    "/api/page",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            page: newPage
                        })
                    }
                );


            const data =
                await response.json();


            if (data.success) {

                currentPage =
                    data.page;

                updateSlide();

                updateButtons();

            }

        }

        catch (error) {

            console.log(
                "Page change error:",
                error
            );

        }

    }


    /* =====================================================
       AUTO SYNC
    ===================================================== */

    async function syncPage() {

        if (!presentationStarted) {
            return;
        }


        try {

            const response =
                await fetch(
                    "/api/state",
                    {
                        cache: "no-store"
                    }
                );


            const data =
                await response.json();


            if (!data.connected) {

                return;
            }


            totalPages =
                data.total_pages;


            if (
                data.current_page !==
                currentPage
            ) {

                currentPage =
                    data.current_page;

                updateSlide();

            }


            updateButtons();

        }

        catch (error) {

            console.log(
                "Sync error:",
                error
            );

        }

    }


    /* =====================================================
       END PRESENTATION
    ===================================================== */

    function endPresentation() {

        const confirmEnd =
            confirm(
                "End this presentation?"
            );


        if (confirmEnd) {

            logoutPresentation();

        }

    }


    /* =====================================================
       LOGOUT
    ===================================================== */

    async function logoutPresentation() {

        const confirmLogout =
            confirm(
                "Are you sure you want to end the presentation?"
            );


        if (!confirmLogout) {
            return;
        }


        try {

            const response =
                await fetch(
                    `/student/${token}/logout`,
                    {
                        method: "POST"
                    }
                );


            const data =
                await response.json();


            if (data.success) {

                document.body.innerHTML = `

                    <div style="
                        min-height:100vh;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        text-align:center;
                        font-family:Arial;
                        background:#111827;
                        color:white;
                        padding:25px;
                    ">

                        <div>

                            <h2>
                                Presentation Ended
                            </h2>

                            <p>
                                Thank you.
                            </p>

                            <p style="
                                color:#9ca3af;
                            ">
                                You may close this page.
                            </p>

                        </div>

                    </div>

                `;

            }

        }

        catch (error) {

            alert(
                "Could not logout."
            );

            console.log(error);

        }

    }


    /* =====================================================
       START SYNC
    ===================================================== */

    setInterval(
        syncPage,
        500
    );

</script>

</body>

</html>
